name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (for example v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write   # needed only to attach the zip to a release on version tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install packages
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests (includes checking the bundled datasets, workbooks and answer key against the generator)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build exe with PyInstaller
        run: python -m PyInstaller --noconfirm --clean Finance_Dojo.spec

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $report = Join-Path $PWD "dist\self_test_report.txt"
          $env:FTS_SELFTEST_REPORT = $report
          $p = Start-Process -FilePath "dist\Finance_Dojo\Finance_Dojo.exe" -ArgumentList "--self-test" -PassThru -Wait
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path dist\Finance_Dojo -DestinationPath dist\Finance_Dojo_Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Finance_Dojo_Windows
          path: |
            dist/Finance_Dojo_Windows.zip
            dist/self_test_report.txt

      - name: Attach to release (version tags, or a release tag given when run by hand)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Finance Dojo ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/Finance_Dojo_Windows.zip
            dist/self_test_report.txt
